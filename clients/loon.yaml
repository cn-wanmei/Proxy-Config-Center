# Loon 独立客户端输出定义
# 4.0 hierarchical RAW adapter
version: 1
id: loon
name: Loon
extension: .list
root: rules/Loon
collection: global
format: classical
rule_types:
  domain: DOMAIN
  domain_suffix: DOMAIN-SUFFIX
  domain_keyword: DOMAIN-KEYWORD
  ip_cidr: IP-CIDR
  ip_cidr6: IP-CIDR6
  user_agent: USER-AGENT
names:
  google: Google
  youtube: YouTube
  google-play: GooglePlay
  google-fcm: GoogleFCM
  youtube-music: YouTubeMusic
