name: Bootstrap v1.0.2 Release (one-time)

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[v102-release-cleanup]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Align v1.0.2 tag to this clean main commit
        run: |
          VERSION=$(python scripts/version.py)
          test "$VERSION" = "1.0.2"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f v1.0.2 HEAD
          git push --force origin refs/tags/v1.0.2
          test "$(git rev-list -n1 v1.0.2)" = "$(git rev-parse HEAD)"
      - name: Validate
        run: python scripts/validate.py
      - name: Capability tests
        run: python tests/test_capabilities.py
      - name: Semantic tests
        run: python tests/test_semantic.py
      - name: Golden tests
        run: python tests/test_golden.py
      - name: Build
        run: python scripts/build.py
      - name: Structural check
        run: python scripts/check_config.py
      - name: Rule source health
        run: python scripts/check_rule_sources.py
      - name: Pack configs
        run: |
          rm -rf dist
          mkdir -p dist/configs
          cp build/clash-meta/config.yaml dist/clash-meta.yaml
          cp build/clash/config.yaml dist/clash.yaml
          cp build/stash/config.yaml dist/stash.yaml
          cp build/egern/config.yaml dist/egern.yaml
          cp build/loon/config.conf dist/loon.conf
          cp build/shadowrocket/config.conf dist/shadowrocket.conf
          cp -r build/. dist/configs/
          cd dist
          zip -r proxy-config-center-v1.0.2.zip configs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-configs-bootstrap
          path: dist/*
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
      - name: Remove one-time bootstrap workflow
        run: |
          rm -f .github/workflows/bootstrap-v102-release.yml
          git add .github/workflows/bootstrap-v102-release.yml
          git commit -m 'chore: remove one-time v1.0.2 release bootstrap [v102-release-cleanup]'
          git push origin HEAD:main
