name: Remote Rule Health

on:
  release:
    types: [published]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --fail --location --retry 3 --retry-delay 2 \
            -o dist/release-manifest.json \
            https://github.com/cn-wanmei/Proxy-Config-Center/releases/latest/download/release-manifest.json
      - name: Validate latest remote assets
        run: python scripts/check_remote_rules.py --manifest dist/release-manifest.json
