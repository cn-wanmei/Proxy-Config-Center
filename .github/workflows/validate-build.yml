name: Validate Rules

on:
  push:
    branches: [main]
    paths:
      - 'core/rules/**'
      - 'scripts/engines/**'
      - 'scripts/rule_*.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'VERSION'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'core/rules/**'
      - 'scripts/engines/**'
      - 'scripts/rule_*.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'VERSION'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Core boundary
        run: python scripts/engines/core_boundary.py
      - name: Audit gate
        run: python scripts/rule_audit_gate.py --write --out dist
      - name: Deterministic rule compile
        run: python scripts/rule_compile.py --out dist
      - name: Semantic tests
        run: python tests/test_semantic_3_2.py
      - name: Compiler tests
        run: python tests/test_rule_compile_3_2.py
      - name: Existing rule-only regressions
        run: |
          python tests/test_rule_only.py
          python tests/test_rule_intelligence.py
      - name: Upload rule artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rules-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
