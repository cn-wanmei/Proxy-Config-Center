name: Validate & Build

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'platforms/**'
      - 'scripts/**'
      - 'tests/**'
      - 'common/schemas/**'
      - 'requirements.txt'
      - 'VERSION'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'platforms/**'
      - 'scripts/**'
      - 'tests/**'
      - 'common/schemas/**'
      - 'requirements.txt'
      - 'VERSION'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Core + Capabilities + References
        run: python scripts/validate.py
      - name: Capability matrix
        run: python scripts/engines/capability.py
      - name: Capability tests
        run: python tests/test_capabilities.py
      - name: Rule Source regression
        run: python tests/test_rule_sources.py
      - name: Semantic tests
        run: python tests/test_semantic.py
      - name: Golden snapshot tests
        run: python tests/test_golden.py
      - name: Rule source health
        run: python scripts/check_rule_sources.py

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build all platforms
        run: python scripts/build.py
      - name: Structural check
        run: python scripts/check_config.py
      - name: Generated diff safety
        run: python scripts/config_diff.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-configs-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 14
