name: Validate & Build

# 唯一校验入口：push/PR 均走这里；成功后由 build.yml workflow_run 回写 final
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'platforms/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'platforms/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate Core + Capabilities
        run: python scripts/validate.py
      - name: Capability matrix
        run: python scripts/engines/capability.py
      - name: Capability tests
        run: python tests/test_capabilities.py
      - name: Rule Source regression
        run: python tests/test_rule_sources.py
      - name: Semantic tests
        run: python tests/test_semantic.py
      - name: Golden tests
        run: python tests/test_golden.py
      - name: BM URL health (sample)
        run: python scripts/check_bm_urls.py
        continue-on-error: true

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Build all platforms
        run: python scripts/build.py
      - name: Structural check (build + final)
        run: python scripts/check_config.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proxy-configs
          path: |
            build/
            final/
          if-no-files-found: warn
