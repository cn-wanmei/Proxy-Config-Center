name: Auto Release Tag

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Wait for current commit validation
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            state=$(gh run list --workflow validate-build.yml --commit "$TARGET_SHA" --limit 1 --json status,conclusion --jq '.[0] | [.status, (.conclusion // "")] | @tsv' || true)
            status=$(printf '%s' "$state" | cut -f1)
            conclusion=$(printf '%s' "$state" | cut -f2)
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || { echo "Validate & Build failed: $conclusion"; exit 1; }
              echo "Validate & Build passed for $TARGET_SHA"
              exit 0
            fi
            echo "Waiting for Validate & Build ($attempt/60): ${state:-not started}"
            sleep 10
          done
          echo "Timed out waiting for Validate & Build"
          exit 1
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION: $VERSION"; exit 1; }
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Ensure release tag and target
        id: tag
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          CURRENT_SHA: ${{ github.sha }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const currentSha = process.env.CURRENT_SHA;
            let targetSha = currentSha;
            try {
              const ref = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag.slice(1)}`,
              });
              targetSha = ref.data.object.sha;
              core.info(`${tag} already exists at ${targetSha}; keeping the immutable release target.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: currentSha,
              });
              core.info(`Created ${tag} at ${currentSha}`);
            }
            core.setOutput('target_sha', targetSha);
      - name: Dispatch release workflow
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.tag.outputs.target_sha }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: {
                release_tag: process.env.RELEASE_TAG,
                target_sha: process.env.TARGET_SHA,
              },
            });
            core.info(`Dispatched Release for ${process.env.RELEASE_TAG} at ${process.env.TARGET_SHA}`);
