name: Auto Release Tag

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Wait for current commit validation
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            state=$(gh run list --workflow validate-build.yml --commit "$TARGET_SHA" --limit 1 --json status,conclusion --jq '.[0] | [.status, (.conclusion // "")] | @tsv' || true)
            status=$(printf '%s' "$state" | cut -f1)
            conclusion=$(printf '%s' "$state" | cut -f2)
            if [[ "$status" == "completed" ]]; then
              [[ "$conclusion" == "success" ]] || { echo "Validate & Build failed: $conclusion"; exit 1; }
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION: $VERSION"; exit 1; }
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Resolve immutable tag target
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if target=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG#v}" --jq '.object.sha' 2>/dev/null); then
            echo "Using existing $RELEASE_TAG -> $target"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$CURRENT_SHA" >/dev/null
            target="$CURRENT_SHA"
            echo "Created $RELEASE_TAG -> $target"
          fi
          echo "target_sha=$target" >> "$GITHUB_OUTPUT"
      - name: Dispatch release workflow
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          TARGET_SHA: ${{ steps.tag.outputs.target_sha }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: {
                release_tag: process.env.RELEASE_TAG,
                target_sha: process.env.TARGET_SHA,
              },
            });
