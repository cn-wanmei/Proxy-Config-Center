name: Bootstrap v1.1.0

on:
  push:
    branches:
      - feature/v1.1-platform-contract-singbox

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.1.0 tag on current main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const sha = branch.commit.sha;
            try {
              await github.rest.git.getRef({ owner, repo, ref: 'tags/v1.1.0' });
              core.info('v1.1.0 already exists; nothing to do.');
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: 'refs/tags/v1.1.0', sha });
              core.info(`Created v1.1.0 -> ${sha}`);
            }
