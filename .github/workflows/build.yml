name: Build Platform Configs

# 唯一负责：core/platforms/scripts 变更 → 测试 → 构建 → 回写 build/final
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'platforms/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate Core + Capabilities
        run: python scripts/validate.py

      - name: Capability tests
        run: python tests/test_capabilities.py

      - name: Rule Source regression
        run: python tests/test_rule_sources.py

      - name: Golden tests
        run: python tests/test_golden.py

      - name: Build all platforms
        run: python scripts/build.py

      - name: Structural check
        run: python scripts/check_config.py

      - name: Commit generated configs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build/ final/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-build [skip ci]"
            git push
          fi
