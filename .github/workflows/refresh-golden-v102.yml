name: Refresh v1.0.2 Golden Snapshot

on:
  push:
    branches:
      - agent/v1.0.2-release-hardening

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[golden-refresh]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build and refresh manifest
        run: |
          python scripts/build.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('.')
          build = root / 'build'
          files = {}
          for path in sorted(build.rglob('*')):
              if path.is_file():
                  rel = path.relative_to(build).as_posix()
                  data = path.read_bytes()
                  header = f'blob {len(data)}\\0'.encode()
                  files[rel] = hashlib.sha1(header + data).hexdigest()
          manifest = {'version': '1.0.2', 'files': files}
          (root / 'tests/golden/manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\\n', encoding='utf-8')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
      - name: Commit refreshed manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/golden/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'test: refresh v1.0.2 golden snapshot [golden-refresh]'
          git push
