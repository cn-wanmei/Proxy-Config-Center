name: Bootstrap v1.0.2 Tag (one-time)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: "!contains(github.event.head_commit.message, '[v102-bootstrap-cleanup]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create clean v1.0.2 tag and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          if [[ "$VERSION" != "1.0.2" ]]; then
            echo "Bootstrap is only allowed for VERSION 1.0.2; found $VERSION"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v1.0.2" >/dev/null 2>&1; then
            echo "v1.0.2 already exists; nothing to do"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/bootstrap-v102-tag.yml
          git add .github/workflows/bootstrap-v102-tag.yml
          git commit -m 'chore: remove one-time v1.0.2 tag bootstrap [v102-bootstrap-cleanup]'
          git tag -a v1.0.2 -m 'Release v1.0.2' HEAD
          git push origin HEAD:main
          git push origin v1.0.2
