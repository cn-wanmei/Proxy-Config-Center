name: Validate Rules

on:
  push:
    branches: [main, 4.0-client-hierarchy]
    paths-ignore:
      - 'rules/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/engines/core_boundary.py
      - run: python scripts/rule_audit_gate.py
      - run: python tests/test_semantic_4_0.py
      - run: python tests/test_rule_compile_4_0.py
      - run: rm -rf .audit/generated
      - run: python scripts/rule_compile.py --out .audit/generated
      - run: test -d .audit/generated/rules
      - run: test -d rules || true
      - if: hashFiles('rules/**') != ''
        run: diff -ru rules .audit/generated/rules
