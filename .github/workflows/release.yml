name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate
        run: python scripts/validate.py
      - name: Semantic tests
        run: python tests/test_semantic.py
      - name: Golden tests
        run: python tests/test_golden.py
      - name: Build
        run: python scripts/build.py
      - name: Structural check
        run: python scripts/check_config.py
      - name: Pack configs
        run: |
          mkdir -p dist
          cp -r build dist/configs
          cd dist && zip -r proxy-config-center-configs.zip configs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-configs
          path: dist/proxy-config-center-configs.zip
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/proxy-config-center-configs.zip
          generate_release_notes: true
