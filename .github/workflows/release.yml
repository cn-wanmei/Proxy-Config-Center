name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    # Formal release is tag-only. PRs/release branches must use the normal CI
    # validation workflow and can never create or mutate a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve release tag
        id: release_meta
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ "$TAG" != v* ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate version
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          VERSION=$(python scripts/version.py)
          if [[ "${RELEASE_TAG#v}" != "$VERSION" ]]; then
            echo "Release $RELEASE_TAG does not match VERSION $VERSION"
            exit 1
          fi
      - name: Validate
        run: python scripts/validate.py
      - name: Capability tests
        run: python tests/test_capabilities.py
      - name: Semantic tests
        run: python tests/test_semantic.py
      - name: Golden tests
        run: python tests/test_golden.py
      - name: Build
        run: python scripts/build.py
      - name: Structural check
        run: python scripts/check_config.py
      - name: Rule source health
        run: python scripts/check_rule_sources.py
      - name: Pack configs
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          rm -rf dist
          mkdir -p dist/configs
          cp build/clash-meta/config.yaml dist/clash-meta.yaml
          cp build/clash/config.yaml dist/clash.yaml
          cp build/stash/config.yaml dist/stash.yaml
          cp build/egern/config.yaml dist/egern.yaml
          cp build/loon/config.conf dist/loon.conf
          cp build/shadowrocket/config.conf dist/shadowrocket.conf
          cp -r build/. dist/configs/
          cd dist
          zip -r "proxy-config-center-${RELEASE_TAG}.zip" configs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-configs
          path: dist/*
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
