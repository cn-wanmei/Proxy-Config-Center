name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish'
        required: true
        type: string
      target_sha:
        description: 'Commit SHA the release must build'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PYTHONPATH: ${{ github.workspace }}/scripts
  RAW_RULE_BASE: https://raw.githubusercontent.com/cn-wanmei/Proxy-Config-Center/latest-rules/rules/
  RAW_CLIENT_BASE: https://raw.githubusercontent.com/cn-wanmei/Proxy-Config-Center/latest-rules/clients/

jobs:
  release:
    if: ${{ github.event_name == 'push' || (inputs.release_tag != '' && inputs.target_sha != '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release target
        id: release_meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_SHA: ${{ inputs.target_sha }}
          EVENT_TAG: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$EVENT_TAG}"
          SHA="${INPUT_SHA:-$EVENT_SHA}"
          [[ "$TAG" == v* ]] || { echo "Invalid release tag: $TAG"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid target SHA: $SHA"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_meta.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate version
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          VERSION=$(python scripts/version.py)
          [[ "${RELEASE_TAG#v}" == "$VERSION" ]] || { echo "Release $RELEASE_TAG does not match VERSION $VERSION"; exit 1; }

      - name: Validate
        run: python scripts/validate.py
      - name: Rule coverage audit
        run: python scripts/rule_audit.py --write
      - name: Capability tests
        run: python tests/test_capabilities.py
      - name: Semantic tests
        run: python tests/test_semantic.py
      - name: Seven-platform semantic equivalence
        run: python tests/test_platform_semantics.py
      - name: Build
        run: python scripts/build.py --include-final
      - name: Golden tests
        run: python tests/test_golden.py
      - name: Structural check - build
        run: python scripts/check_config.py --root build
      - name: Structural check - final compatibility
        run: python scripts/check_config.py --root final
      - name: Rule source health
        run: python scripts/check_rule_sources.py

      - name: Pack complete release
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/configs dist/rules
          cp build/clash-meta/config.yaml dist/clash-meta.yaml
          cp build/clash/config.yaml dist/clash.yaml
          cp build/stash/config.yaml dist/stash.yaml
          cp build/egern/config.yaml dist/egern.yaml
          cp build/loon/config.conf dist/loon.conf
          cp build/shadowrocket/config.conf dist/shadowrocket.conf
          cp build/sing-box/config.json dist/sing-box.json
          cp -r build/. dist/configs/
          python scripts/pack_remote_rules.py --output dist/rules
          cp core/rules/priority.yaml dist/rules/priority.yaml
          cp core/rules/sources.yaml dist/rules/sources.yaml
          for f in rules/manual/direct.list rules/manual/proxy.list rules/manual/ehentai.list; do
            [[ -s "$f" ]] || { echo "Missing manual rule file: $f"; exit 1; }
            cp "$f" "dist/rules/rule-$(basename "$f")"
          done
          cp dist/rules/rule-* dist/
          cp dist/rules/priority.yaml dist/priority.yaml
          cp dist/rules/sources.yaml dist/sources.yaml
          python scripts/rewrite_release_urls.py --root dist
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('dist')
          rules = sorted(list(root.glob('rule-*.yaml')) + list(root.glob('rule-*.list')))
          clients = ['clash.yaml', 'clash-meta.yaml', 'stash.yaml', 'egern.yaml', 'loon.conf', 'shadowrocket.conf', 'sing-box.json']
          def sha256(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          rule_base = 'https://raw.githubusercontent.com/cn-wanmei/Proxy-Config-Center/latest-rules/rules/'
          client_base = 'https://raw.githubusercontent.com/cn-wanmei/Proxy-Config-Center/latest-rules/clients/'
          manifest = {'release': '${{ steps.release_meta.outputs.tag }}', 'version': '${{ steps.release_meta.outputs.tag }}'[1:], 'remote_policy': 'latest-rules', 'remote_base': rule_base, 'client_base': client_base, 'clients': [], 'rules': []}
          for name in clients:
              p = root / name
              manifest['clients'].append({'name': name, 'asset': name, 'latest_url': client_base + name, 'sha256': sha256(p), 'size': p.stat().st_size})
          for p in rules:
              manifest['rules'].append({'name': p.stem, 'asset': p.name, 'source': p.name, 'latest_url': rule_base + p.name, 'sha256': sha256(p), 'size': p.stat().st_size})
          (root / 'release-manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          cp dist/release-manifest.json dist/configs/release-manifest.json
          cp -r dist/rules dist/configs/rules
          (cd dist && sha256sum *.yaml *.conf *.json rule-*.yaml rule-*.list > SHA256SUMS)
          cp dist/SHA256SUMS dist/configs/SHA256SUMS
          cd dist
          tar -czf "proxy-config-center-${RELEASE_TAG}-rules.tar.gz" rule-*.yaml rule-*.list release-manifest.json SHA256SUMS
          zip -r "proxy-config-center-${RELEASE_TAG}.zip" configs

      - name: Verify complete release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -euo pipefail
          required=("dist/clash.yaml" "dist/clash-meta.yaml" "dist/stash.yaml" "dist/egern.yaml" "dist/loon.conf" "dist/shadowrocket.conf" "dist/sing-box.json" "dist/release-manifest.json" "dist/SHA256SUMS" "dist/proxy-config-center-${RELEASE_TAG}-rules.tar.gz" "dist/proxy-config-center-${RELEASE_TAG}.zip" "dist/rule-direct.list" "dist/rule-proxy.list" "dist/rule-ehentai.list")
          for file in "${required[@]}"; do
            [[ -s "$file" ]] || { echo "Missing or empty release asset: $file"; exit 1; }
          done
          rule_count=$(find dist -maxdepth 1 -type f \( -name 'rule-*.yaml' -o -name 'rule-*.list' \) | wc -l)
          [[ "$rule_count" -ge 3 ]] || { echo "Insufficient remote rule assets generated"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-configs
          path: |
            dist/clash.yaml
            dist/clash-meta.yaml
            dist/stash.yaml
            dist/egern.yaml
            dist/loon.conf
            dist/shadowrocket.conf
            dist/sing-box.json
            dist/rule-*.yaml
            dist/rule-*.list
            dist/release-manifest.json
            dist/SHA256SUMS
            dist/proxy-config-center-${{ steps.release_meta.outputs.tag }}-rules.tar.gz
            dist/proxy-config-center-${{ steps.release_meta.outputs.tag }}.zip
            dist/configs/**
          if-no-files-found: error

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/clash.yaml
            dist/clash-meta.yaml
            dist/stash.yaml
            dist/egern.yaml
            dist/loon.conf
            dist/shadowrocket.conf
            dist/sing-box.json
            dist/rule-*.yaml
            dist/rule-*.list
            dist/release-manifest.json
            dist/SHA256SUMS
            dist/proxy-config-center-${{ steps.release_meta.outputs.tag }}-rules.tar.gz
            dist/proxy-config-center-${{ steps.release_meta.outputs.tag }}.zip

      - name: Publish or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            dist/clash.yaml dist/clash-meta.yaml dist/stash.yaml dist/egern.yaml
            dist/loon.conf dist/shadowrocket.conf dist/sing-box.json
            dist/rule-*.yaml dist/rule-*.list dist/release-manifest.json dist/SHA256SUMS
            "dist/proxy-config-center-${RELEASE_TAG}-rules.tar.gz"
            "dist/proxy-config-center-${RELEASE_TAG}.zip"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --latest
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --latest "${assets[@]}"
          fi

      - name: Publish verified clients and rules to latest-rules
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin latest-rules
          rm -rf /tmp/pcc-latest-rules
          git worktree add /tmp/pcc-latest-rules origin/latest-rules
          cd /tmp/pcc-latest-rules
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p clients rules
          for client in clash.yaml clash-meta.yaml stash.yaml egern.yaml loon.conf shadowrocket.conf sing-box.json; do
            cp "$GITHUB_WORKSPACE/dist/$client" "clients/$client"
          done
          cp "$GITHUB_WORKSPACE"/dist/rules/* rules/
          cp "$GITHUB_WORKSPACE"/dist/release-manifest.json release-manifest.json
          cp "$GITHUB_WORKSPACE"/dist/SHA256SUMS SHA256SUMS
          git add -A
          git commit -m "release: publish ${RELEASE_TAG} clients and rules" || true
          git push origin HEAD:latest-rules

      - name: Verify Raw clients and rules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess, time
          from pathlib import Path
          manifest = json.loads(Path('dist/release-manifest.json').read_text(encoding='utf-8'))
          checks = manifest['clients'] + manifest['rules']
          for item in checks:
              url = item['latest_url']
              target = Path('/tmp') / item['asset']
              ok = False
              for _ in range(8):
                  result = subprocess.run(['curl', '-fsSL', '--retry', '2', '-o', str(target), url], check=False)
                  if result.returncode == 0:
                      data = target.read_bytes()
                      if hashlib.sha256(data).hexdigest() == item['sha256']:
                          ok = True
                          break
                  time.sleep(3)
              if not ok:
                  raise SystemExit(f'Raw verification failed: {url}')
              print(f'OK {url}')
          PY

      - name: Verify Raw manifest endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            -o /tmp/pcc-raw-manifest.json \
            https://raw.githubusercontent.com/cn-wanmei/Proxy-Config-Center/latest-rules/release-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          local = json.loads(Path('dist/release-manifest.json').read_text(encoding='utf-8'))
          remote = json.loads(Path('/tmp/pcc-raw-manifest.json').read_text(encoding='utf-8'))
          if local != remote:
              raise SystemExit('Raw release-manifest.json differs from the published manifest')
          print('Raw manifest verified.')
          PY
