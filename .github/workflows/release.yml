name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PYTHONPATH: ${{ github.workspace }}/scripts

jobs:
  release:
    # Formal release is tag-only. PRs/release branches must use normal CI.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve release tag
        id: release_meta
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          if [[ "$TAG" != v* ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate version
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          VERSION=$(python scripts/version.py)
          if [[ "${RELEASE_TAG#v}" != "$VERSION" ]]; then
            echo "Release $RELEASE_TAG does not match VERSION $VERSION"
            exit 1
          fi
      - name: Validate
        run: python scripts/validate.py
      - name: Rule coverage audit
        run: python scripts/rule_audit.py --write
      - name: Capability tests
        run: python tests/test_capabilities.py
      - name: Semantic tests
        run: python tests/test_semantic.py
      - name: Seven-platform semantic equivalence
        run: python tests/test_platform_semantics.py
      - name: Build
        run: python scripts/build.py --include-final
      - name: Golden tests
        run: python tests/test_golden.py
      - name: Structural check - build
        run: python scripts/check_config.py --root build
      - name: Structural check - final compatibility
        run: python scripts/check_config.py --root final
      - name: Rule source health
        run: python scripts/check_rule_sources.py
      - name: Pack configs
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          rm -rf dist
          mkdir -p dist/configs
          cp build/clash-meta/config.yaml dist/clash-meta.yaml
          cp build/clash/config.yaml dist/clash.yaml
          cp build/stash/config.yaml dist/stash.yaml
          cp build/egern/config.yaml dist/egern.yaml
          cp build/loon/config.conf dist/loon.conf
          cp build/shadowrocket/config.conf dist/shadowrocket.conf
          cp build/sing-box/config.json dist/sing-box.json
          cp -r build/. dist/configs/
          cd dist
          zip -r "proxy-config-center-${RELEASE_TAG}.zip" configs
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "dist/clash.yaml"
            "dist/clash-meta.yaml"
            "dist/stash.yaml"
            "dist/egern.yaml"
            "dist/loon.conf"
            "dist/shadowrocket.conf"
            "dist/sing-box.json"
          )
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing or empty release asset: $file"
              exit 1
            fi
          done
          zip_file="dist/proxy-config-center-${GITHUB_REF_NAME}.zip"
          if [[ ! -s "$zip_file" ]]; then
            echo "Missing or empty release archive: $zip_file"
            exit 1
          fi
          echo "Verified release assets:"
          printf ' - %s\n' "${required[@]}" "$zip_file"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-configs
          path: |
            dist/clash.yaml
            dist/clash-meta.yaml
            dist/stash.yaml
            dist/egern.yaml
            dist/loon.conf
            dist/shadowrocket.conf
            dist/sing-box.json
            dist/proxy-config-center-${{ github.ref_name }}.zip
            dist/configs/**
          if-no-files-found: error
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/clash.yaml
            dist/clash-meta.yaml
            dist/stash.yaml
            dist/egern.yaml
            dist/loon.conf
            dist/shadowrocket.conf
            dist/sing-box.json
            dist/proxy-config-center-${{ github.ref_name }}.zip
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/clash.yaml
            dist/clash-meta.yaml
            dist/stash.yaml
            dist/egern.yaml
            dist/loon.conf
            dist/shadowrocket.conf
            dist/sing-box.json
            dist/proxy-config-center-${{ github.ref_name }}.zip
          generate_release_notes: true
          make_latest: true
