name: Release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release version, e.g. 1.6.0
        required: true
        type: string
permissions:
  contents: write
  id-token: write
  attestations: write
env:
  PYTHONPATH: ${{ github.workspace }}/scripts
  SOURCE_DATE_EPOCH: 0
  RAW_RULE_BASE: https://raw.githubusercontent.com/cn-wanmei/Proxy-Config-Center/latest-rules/rules/
  RAW_CLIENT_BASE: https://raw.githubusercontent.com/cn-wanmei/Proxy-Config-Center/latest-rules/clients/
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Resolve immutable source
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.release_tag }}'; [[ "$tag" == v* ]] || tag="v$tag"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo invalid version; exit 1; }
          git fetch origin main --force
          sha=$(git rev-parse origin/main)
          version=$(python scripts/version.py)
          [[ "${tag#v}" == "$version" ]] || { echo "VERSION=$version != $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout resolved source
        run: |
          git checkout --detach "${{ steps.meta.outputs.sha }}"
          test "$(git rev-parse HEAD)" = "${{ steps.meta.outputs.sha }}"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Validate source and semantics
        run: |
          python scripts/validate.py
          python scripts/rule_audit.py --write
          python tests/test_capabilities.py
          python tests/test_semantic.py
          python tests/test_platform_semantics.py
      - name: Build and golden validation
        run: |
          python scripts/build.py --include-final
          python tests/test_golden.py
          python scripts/check_config.py --root build
          python scripts/check_config.py --root final
          python scripts/check_rule_sources.py
      - name: Generate engineering and supply-chain reports
        run: python scripts/project_audit.py
      - name: Pack release
        env: {RELEASE_TAG: ${{ steps.meta.outputs.tag }} }
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist; mkdir -p dist/configs dist/rules
          cp build/clash-meta/config.yaml dist/clash-meta.yaml; cp build/clash/config.yaml dist/clash.yaml
          cp build/stash/config.yaml dist/stash.yaml; cp build/egern/config.yaml dist/egern.yaml
          cp build/loon/config.conf dist/loon.conf; cp build/shadowrocket/config.conf dist/shadowrocket.conf
          cp build/sing-box/config.json dist/sing-box.json; cp -r build/. dist/configs/
          python scripts/pack_remote_rules.py --output dist/rules
          cp core/rules/priority.yaml dist/rules/priority.yaml; cp core/rules/sources.yaml dist/rules/sources.yaml
          for f in rules/manual/direct.list rules/manual/proxy.list rules/manual/ehentai.list; do test -s "$f"; cp "$f" "dist/rules/rule-$(basename "$f")"; done
          cp dist/rules/rule-* dist/
          python scripts/rewrite_release_urls.py --root dist
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('dist'); clients=['clash.yaml','clash-meta.yaml','stash.yaml','egern.yaml','loon.conf','shadowrocket.conf','sing-box.json']
          rules=sorted(list(root.glob('rule-*.yaml'))+list(root.glob('rule-*.list')))
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          tag=os.environ['RELEASE_TAG']; sha=os.environ.get('GITHUB_SHA','')
          rb='https://raw.githubusercontent.com/cn-wanmei/Proxy-Config-Center/latest-rules/rules/'; cb='https://raw.githubusercontent.com/cn-wanmei/Proxy-Config-Center/latest-rules/clients/'
          m={'release':tag,'version':tag[1:],'source_commit':'${{ steps.meta.outputs.sha }}','generator_commit':'${{ steps.meta.outputs.sha }}','schema_version':'1.0','remote_policy':'latest-rules','clients':[],'rules':[]}
          for n in clients:
            p=root/n; m['clients'].append({'name':n,'asset':n,'latest_url':cb+n,'sha256':h(p),'size':p.stat().st_size})
          for p in rules: m['rules'].append({'name':p.stem,'asset':p.name,'latest_url':rb+p.name,'sha256':h(p),'size':p.stat().st_size})
          (root/'release-manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          (root/'build-report.json').write_text((Path('build/reports/build-report.json')).read_text())
          for p in Path('build/reports').glob('*.json'): (root/p.name).write_text(p.read_text())
          (root/'source-snapshot.json').write_text((Path('build/reports/rule-source-snapshot.json')).read_text())
          (root/'sbom.json').write_text((Path('build/reports/sbom.json')).read_text())
          (root/'schema-version.json').write_text((Path('build/reports/schema-version.json')).read_text())
          (root/'SHA256SUMS').write_text('\n'.join(f'{h(p)}  {p.name}' for p in sorted(root.glob('*')) if p.is_file())+'\n')
          PY
          cp dist/release-manifest.json dist/configs/release-manifest.json
          cp -r dist/rules dist/configs/rules
          cd dist; tar -czf "proxy-config-center-${RELEASE_TAG}-rules.tar.gz" rule-* release-manifest.json SHA256SUMS; zip -qr "proxy-config-center-${RELEASE_TAG}.zip" configs
      - name: Validate release distribution and remote config semantics
        run: python scripts/validate_release_dist.py --root dist
      - name: Validate engineering reports
        run: |
          test -s dist/build-report.json; test -s dist/rule-index.json; test -s dist/rule-graph.json
          test -s dist/rule-conflicts.json; test -s dist/rule-unreachable.json; test -s dist/ai-coverage.json
          test -s dist/source-snapshot.json; test -s dist/sbom.json; test -s dist/schema-version.json
      - name: Generate attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.yaml
            dist/*.conf
            dist/*.json
            dist/*.list
            dist/SHA256SUMS
            dist/*.tar.gz
            dist/*.zip
      - name: Immutable GitHub Release
        env: {GH_TOKEN: ${{ github.token }}, RELEASE_TAG: ${{ steps.meta.outputs.tag }} }
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then echo "Release $RELEASE_TAG already exists; immutable release gate"; exit 1; fi
          assets=(dist/*.yaml dist/*.conf dist/*.json dist/*.list dist/SHA256SUMS dist/*.tar.gz dist/*.zip)
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --latest "${assets[@]}"
      - name: Publish latest-rules atomically
        env: {RELEASE_TAG: ${{ steps.meta.outputs.tag }} }
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf /tmp/latest-rules
          git fetch origin latest-rules || true
          if git show-ref --verify --quiet refs/remotes/origin/latest-rules; then git worktree add /tmp/latest-rules origin/latest-rules; else git worktree add --detach /tmp/latest-rules HEAD; git -C /tmp/latest-rules checkout --orphan latest-rules; fi
          cd /tmp/latest-rules; git rm -rf . >/dev/null 2>&1 || true; mkdir -p clients rules
          for c in clash.yaml clash-meta.yaml stash.yaml egern.yaml loon.conf shadowrocket.conf sing-box.json; do cp "$GITHUB_WORKSPACE/dist/$c" "clients/$c"; done
          cp "$GITHUB_WORKSPACE"/dist/rules/* rules/; cp "$GITHUB_WORKSPACE"/dist/release-manifest.json .; cp "$GITHUB_WORKSPACE"/dist/SHA256SUMS .
          git add -A; git commit -m "release: publish ${RELEASE_TAG}"; git push --force origin HEAD:latest-rules
      - name: E2E Raw HTTP 200 and SHA256
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,time
          from pathlib import Path
          m=json.loads(Path('dist/release-manifest.json').read_text())
          assert len(m['clients'])==7
          for x in m['clients']+m['rules']:
            p=Path('/tmp')/x['asset']; ok=False
            for _ in range(10):
              r=subprocess.run(['curl','-fsSL','--retry','2','-o',str(p),x['latest_url']]);
              if r.returncode==0 and hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256']: ok=True; break
              time.sleep(3)
            if not ok: raise SystemExit('Raw integrity failure: '+x['latest_url'])
          print('Raw E2E integrity OK')
          PY
