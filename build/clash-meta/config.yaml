mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: true
proxy-groups:
- name: 代理模式
  type: select
  proxies:
  - 手动选择
  - 定向免流
  - 自动选择
  - DIRECT
  - REJECT
  icon: proxy-mode
- name: 手动选择
  type: select
  include-all-providers: true
  icon: manual
- name: 定向免流
  type: select
  include-all-providers: true
  filter: (?i)免流
  icon: free-flow
- name: 自动选择
  type: url-test
  include-all-providers: true
  icon: auto
- name: 直连模式
  type: select
  proxies:
  - DIRECT
  icon: direct
- name: 阻断连接
  type: select
  proxies:
  - REJECT
  icon: reject
- name: 广告拦截
