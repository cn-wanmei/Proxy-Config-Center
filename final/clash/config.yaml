  - { name: 绅士漫画, type: select, proxies: [代理模式, 手动选择, 自动选择, DIRECT, REJECT] }
  - { name: 苹果服务, type: select, proxies: [DIRECT, 代理模式, 手动选择, 自动选择, REJECT] }
  - { name: 其它连接, type: select, proxies: [代理模式, 手动选择, 自动选择, DIRECT, REJECT] }
