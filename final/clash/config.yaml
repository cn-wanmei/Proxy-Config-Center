  include-all-providers: true
  use: [机场订阅1]
- name: 定向免流
  type: select
  include-all-providers: true
  use: [机场订阅1]
  filter: (?i)免流
- name: 自动选择
  type: url-test
  include-all-providers: true
  use: [机场订阅1]
