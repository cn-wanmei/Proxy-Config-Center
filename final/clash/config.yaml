# AUTO-GENERATED | blackmatrix7 RULE-SET only (no GEOSITE/GEOIP)

mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: true
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
  default-nameserver: [223.5.5.5, 119.29.29.29, 1.1.1.1]
proxy-groups:
  - { name: 代理模式, type: select, proxies: [手动选择, 定向免流, 自动选择, DIRECT, REJECT] }
  - { name: 手动选择, type: select, proxies: [DIRECT] }
  - { name: 定向免流, type: select, proxies: [DIRECT], filter: "(?i)免流" }
  - { name: 自动选择, type: url-test, proxies: [DIRECT], url: http://www.gstatic.com/generate_204, interval: 300 }
  - { name: 直连模式, type: select, proxies: [DIRECT] }
  - { name: 阻断连接, type: select, proxies: [REJECT] }
  - { name: 广告拦截, type: select, proxies: [REJECT, 代理模式, 手动选择, DIRECT] }
  - { name: 中国连接, type: select, proxies: [DIRECT, 代理模式, 手动选择, 自动选择, REJECT] }
  - { name: 代码仓库, type: select, proxies: [代理模式, 手动选择, 自动选择, DIRECT, REJECT] }
  - { name: 微软服务, type: select, proxies: [代理模式, 手动选择, 自动选择, DIRECT, REJECT] }
  - { name: 游戏平台, type: select, proxies: [代理模式, 手动选择, 自动选择, DIRECT, REJECT] }
  - { name: 人工智能, type: select, proxies: [代理模式, 手动选择, 自动选择, DIRECT, REJECT] }
  - { name: 谷歌服务, type: select, proxies: [代理模式, 手动选择, 自动选择, DIRECT, REJECT] }
  - { name: 油管视频, type: select, proxies: [代理模式, 手动选择, 自动选择, DIRECT, REJECT] }
  - { name: 声破天乐, type: select, proxies: [代理模式, 手动选择, 自动选择, DIRECT, REJECT] }
  - { name: 电报通讯, type: select, proxies: [代理模式, 手动选择, 自动选择, DIRECT, REJECT] }
  - { name: 推特社交, type: select, proxies: [代理模式, 手动选择, 自动选择, DIRECT, REJECT] }
  - { name: 奈飞影视, type: select, proxies: [代理模式, 手动选择, 自动选择, DIRECT, REJECT] }
