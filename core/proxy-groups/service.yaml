# Service strategy groups / 分流策略组
# Platform-agnostic semantic definition
# Each service binds both proxy strategy and DNS policy
# Priority is defined ONLY in core/rules/priority.yaml (single source of truth)
# 优先级只在 priority.yaml 中定义，此处不重复

version: 1

groups:
  - id: ad-block
    name: { zh: 广告拦截, en: Ad Block }
    type: select
    proxy:
      options: [reject, proxy-mode, manual-select, direct]
      default: reject
    dns: dns-system
    icon: ad-block

  - id: china
    name: { zh: 中国连接, en: China }
    type: select
    proxy:
      options: [direct, proxy-mode, manual-select, auto-select, reject]
