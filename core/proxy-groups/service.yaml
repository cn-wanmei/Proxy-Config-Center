# Service strategy groups / 分流策略组
# Platform-agnostic semantic definition
# 平台无关语义定义
#
# Rules:
# - 中国连接 & 苹果服务: direct first
# - Other groups: proxy-mode → manual-select → auto-select → direct → reject

version: 1

groups:
  - id: ad-block
    name:
      zh: 广告拦截
      en: Ad Block
    type: select
    options:
      - action: reject
      - ref: proxy-mode
      - ref: manual-select
      - action: direct
    icon: ad-block
    default: reject
    priority: 1

  - id: china
    name:
      zh: 中国连接
      en: China
    type: select
    options:
