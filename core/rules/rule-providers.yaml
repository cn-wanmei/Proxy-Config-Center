# ============================================================
# Rule sources: GEOSITE / GEOIP first, then blackmatrix7 fallback
# ============================================================
version: 1

base_url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash"

# Each entry maps a service group id → rule-provider + optional geosite/geoip
providers:
  ad-block:
    geosite: [category-ads-all]
    blackmatrix7: AdvertisingLite/AdvertisingLite.yaml
    behavior: classical

  china:
    geosite: [cn]
    geoip: [CN]
    blackmatrix7: China/China.yaml
    behavior: classical

  apple:
    geosite: [apple]
    blackmatrix7: Apple/Apple.yaml
    behavior: classical

  github:
    geosite: [github]
    blackmatrix7: GitHub/GitHub.yaml
    behavior: classical

  microsoft:
    geosite: [microsoft]
    blackmatrix7: Microsoft/Microsoft.yaml
    behavior: classical

  google:
    geosite: [google]
    blackmatrix7: Google/Google.yaml
    behavior: classical

  youtube:
    geosite: [youtube]
    blackmatrix7: YouTube/YouTube.yaml
    behavior: classical

  spotify:
    geosite: [spotify]
    blackmatrix7: Spotify/Spotify.yaml
    behavior: classical

  telegram:
    geosite: [telegram]
    blackmatrix7: Telegram/Telegram.yaml
    behavior: classical

  twitter:
    geosite: [twitter]
    blackmatrix7: Twitter/Twitter.yaml
    behavior: classical

  netflix:
    geosite: [netflix]
    blackmatrix7: Netflix/Netflix.yaml
    behavior: classical

  tiktok:
    geosite: [tiktok]
    blackmatrix7: TikTok/TikTok.yaml
    behavior: classical

  game:
    geosite: [steam]
    blackmatrix7: Steam/Steam.yaml
    behavior: classical

  ai:
    geosite: [openai]
    blackmatrix7: OpenAI/OpenAI.yaml
    behavior: classical

  ehentai:
    # no stable geosite — domain rules + optional list
    domains:
      - e-hentai.org
      - exhentai.org
      - ehgt.org
      - hath.network
