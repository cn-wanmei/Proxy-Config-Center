# 分流源：blackmatrix7 为主；domain_suffix 供不支持 rule-set 的平台 fallback
# Shadowrocket 及其他不支持 rule-set 的平台仅依赖 domain_suffix
# 更新说明：补全各服务关键 domain_suffix，提升非 Clash 平台分流覆盖率
version: 2
engine: blackmatrix7

blackmatrix7_base: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash"

sources:
  ad-block:
    blackmatrix7:
      path: AdvertisingLite/AdvertisingLite.yaml
      behavior: classical
    domain_suffix:
      - doubleclick.net
      - googlesyndication.com
      - googletagmanager.com
      - googleadservices.com
      - adservice.google.com
      - pagead2.googlesyndication.com

  china:
