# Core Rule Source — 仅 blackmatrix7（无 GEOSITE / GEOIP）
version: 2
engine: blackmatrix7

blackmatrix7_base: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash"

sources:
  ad-block:
    blackmatrix7:
      path: AdvertisingLite/AdvertisingLite.yaml
      behavior: classical

  china:
    blackmatrix7:
      path: China/China.yaml
      behavior: classical
    blackmatrix7_extra:
      - path: ChinaIPs/ChinaIPs.yaml
        behavior: classical

  apple:
    blackmatrix7:
      path: Apple/Apple.yaml
      behavior: classical

  code-repo:
    blackmatrix7:
      path: GitHub/GitHub.yaml
      behavior: classical

  microsoft:
    blackmatrix7:
      path: Microsoft/Microsoft.yaml
      behavior: classical

  google:
    blackmatrix7:
      path: Google/Google.yaml
      behavior: classical

  youtube:
    blackmatrix7:
      path: YouTube/YouTube.yaml
      behavior: classical

  spotify:
    blackmatrix7:
      path: Spotify/Spotify.yaml
      behavior: classical

  telegram:
    blackmatrix7:
      path: Telegram/Telegram.yaml
      behavior: classical

  twitter:
    blackmatrix7:
      path: Twitter/Twitter.yaml
      behavior: classical

  netflix:
    blackmatrix7:
      path: Netflix/Netflix.yaml
      behavior: classical

  tiktok:
    blackmatrix7:
      path: TikTok/TikTok.yaml
      behavior: classical

  game:
    blackmatrix7:
      path: Steam/Steam.yaml
      behavior: classical

  ai:
    blackmatrix7:
      path: OpenAI/OpenAI.yaml
      behavior: classical

  ehentai:
    domain_suffix:
      - e-hentai.org
      - exhentai.org
      - ehgt.org
      - hath.network

  final:
    match: true
