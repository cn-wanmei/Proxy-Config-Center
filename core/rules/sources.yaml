policy:
  additions_require: 1
  removals_require_consecutive_misses: 3
  max_daily_change_ratio: 0.35
  ignore_dynamic_dns_ips: true
  github_ip_keys: [web, api, git, packages, pages, importer, actions, dependabot, copilot]
