# Netflix service rules / 奈飞影视规则
version: 1
id: service-netflix
group: netflix
priority: 110

rules:
  - type: geosite
    values: [netflix]
    action: group
    target: netflix
  - type: domain-suffix
    values: [netflix.com, nflxvideo.net, nflxso.net, nflximg.net]
    action: group
    target: netflix
