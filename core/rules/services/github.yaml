# GitHub umbrella service / GitHub 总服务
version: 2
id: service-github
group: github
priority: 45
rules:
  - type: domain-suffix
    values:
      - github.com
      - github.dev
      - github.io
      - githubapp.com
      - githubassets.com
      - githubcopilot.com
      - githubusercontent.com
      - githubstatus.com
      - ghcr.io
      - git.io
      - gitlab.com
      - npmjs.com
      - npmjs.org
    action: group
    target: github
  - type: ip-cidr
    values: []
    action: group
    target: github
  - type: ip-cidr6
    values: []
    action: group
    target: github
