# Code repository rules (GitHub etc.)
version: 1
id: service-code-repo
group: code-repo

rules:
  - type: geosite
    values: [github]
    action: group
    target: code-repo
  - type: domain-suffix
    values: [github.com, githubusercontent.com, githubassets.com, gitlab.com]
    action: group
    target: code-repo
