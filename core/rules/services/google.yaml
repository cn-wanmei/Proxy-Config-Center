# Google umbrella service / 谷歌总服务
version: 2
id: service-google
group: google
priority: 60
rules:
  - type: domain-suffix
    values:
      - appspot.com
      - google.com
      - googleapis.com
      - googleusercontent.com
      - gstatic.com
      - g.co
      - ggpht.com
      - gvt1.com
      - gvt2.com
      - recaptcha.net
      - withgoogle.com
    action: group
    target: google
