# Google service rules / 谷歌服务规则
# Platform-agnostic semantic

version: 1
id: service-google
group: google
priority: 60

rules:
  - type: domain-suffix
    values:
      - google.com
      - googleapis.com
      - gstatic.com
      - googleusercontent.com
      - ggpht.com
    action: group
    target: google
