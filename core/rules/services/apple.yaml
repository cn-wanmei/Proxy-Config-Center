# Apple service rules / 苹果服务规则
# Platform-agnostic semantic

version: 1
id: service-apple
group: apple
priority: 15

rules:
  - type: domain-suffix
    values:
      - apple.com
      - icloud.com
      - icloud-content.com
      - apple-cloudkit.com
      - apple-dns.net
      - push.apple.com
      - mzstatic.com
      - itunes.apple.com
      - cdn-apple.com
      - apple-mobile.de
    action: group
    target: apple

  - type: domain-keyword
    values:
      - apple
      - icloud
    action: group
    target: apple
