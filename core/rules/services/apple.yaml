# Apple umbrella service / Apple 总服务
version: 2
id: service-apple
group: apple
priority: 15

# Umbrella only. Detailed services live in dedicated files.
rules:
  - type: domain-suffix
    values:
      - apple.com
      - apple-cloudkit.com
      - apple-dns.net
      - apple-mapkit.com
      - apple.news
      - cdn-apple.com
      - icloud.com
      - icloud-content.com
      - mzstatic.com
      - push.apple.com
    action: group
    target: apple
