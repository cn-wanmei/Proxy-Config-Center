# YouTube service rules / 油管视频规则
# Platform-agnostic semantic

version: 1
id: service-youtube
group: youtube
priority: 70

rules:
  - type: geosite
    values:
      - youtube
    action: group
    target: youtube

  - type: domain-suffix
    values:
      - youtube.com
      - youtu.be
      - googlevideo.com
      - ytimg.com
      - ytimg.com
    action: group
    target: youtube
