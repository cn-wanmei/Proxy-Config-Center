# YouTube — independent (BM7 / v2fly)
version: 1
id: service-youtube
group: youtube
priority: 56

rules:
  - type: domain-suffix
    values:
      - youtube.com
      - youtu.be
      - youtube-nocookie.com
      - youtube-ui.l.google.com
      - youtubei.googleapis.com
      - youtubeembeddedplayer.googleapis.com
      - youtubekids.com
      - youtubegaming.com
      - youtubeeducation.com
      - youtubego.com
      - withyoutube.com
      - yt.be
      - ytimg.com
      - googlevideo.com
      - ggpht.com
      - ggpht.cn
      - gvt1.com
      - gvt2.com
      - video.google.com
      - wide-youtube.l.google.com
    action: group
    target: youtube
  - type: domain-keyword
    values: [youtube]
    action: group
    target: youtube
