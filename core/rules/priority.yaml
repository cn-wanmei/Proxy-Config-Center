    value: 1
    group: ad-block
    description: { zh: 广告拦截, en: Ad blocking }

  - id: lan
    value: 5
    group: direct          # LAN always direct
    description: { zh: 局域网, en: LAN }

  - id: china
    value: 10
    group: china
    description: { zh: 中国连接, en: China }

