# ============================================================
# Proxy Providers & Nodes
# ============================================================
# 默认留空 → 最终配置不写 proxy-providers / YOUR_* 占位
# 填写真实订阅后 enabled: true，再 build

version: 1

subscriptions: []

# 示例:
# subscriptions:
#   - id: airport-1
#     name: { zh: 机场订阅1, en: Airport Sub 1 }
#     url: "https://example.com/subscribe"
#     interval: 86400
#     enabled: true

health_check:
  enable: true
  url: "http://www.gstatic.com/generate_204"
  interval: 300

nodes: []

# 示例单/多节点:
# nodes:
#   - name: "我家VPS"
#     type: ss
#     server: "1.2.3.4"
#     port: 443
#     cipher: aes-128-gcm
#     password: "pass"
#     enabled: true

use_in_groups:
  - manual-select
  - auto-select
  - free-flow
