# DNS Layer 2: Groups (Core V2 — no system group)

version: 2

groups:
  - id: china
    name: { zh: 中国组, en: China Group }
    resolvers: [alidns, tencent]
    default: alidns

  - id: foreign
    name: { zh: 国外组, en: Foreign Group }
    resolvers: [cloudflare, google, alidns]
    default: cloudflare

  - id: secure
    name: { zh: 安全组, en: Secure Group }
    resolvers: [cloudflare, google]
    default: cloudflare

  - id: google
    name: { zh: 谷歌组, en: Google Group }
    resolvers: [google, cloudflare]
    default: google

  - id: cloudflare
    name: { zh: CF组, en: Cloudflare Group }
    resolvers: [cloudflare, google]
    default: cloudflare
