# ============================================================
# DNS Layer 2: Groups (composed from resolvers)
# ============================================================
# A group is an ordered list of resolver ids + optional default.
# Policies reference groups; options in policies must be resolver ids.

version: 1

groups:
  - id: system
    name: { zh: 系统组, en: System Group }
    resolvers: [system]
    default: system

  - id: china
    name: { zh: 中国组, en: China Group }
    resolvers: [alidns, tencent, system]
    default: alidns

  - id: foreign
    name: { zh: 国外组, en: Foreign Group }
    resolvers: [cloudflare, google, alidns]
    default: cloudflare

  - id: secure
    name: { zh: 安全组, en: Secure Group }
    resolvers: [cloudflare, google]
    default: cloudflare

  - id: google
    name: { zh: 谷歌组, en: Google Group }
    resolvers: [google, cloudflare]
    default: google

  - id: cloudflare
    name: { zh: CF组, en: Cloudflare Group }
    resolvers: [cloudflare, google]
    default: cloudflare
