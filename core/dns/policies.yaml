# DNS Layer 3: Policies (Core V2 — no system policy)

version: 2

policies:
  - id: dns-china
    name: { zh: 中国DNS, en: China DNS }
    group: china
    selectable: true
    options: [alidns, tencent, google, cloudflare]
    default: alidns

  - id: dns-foreign
    name: { zh: 国外DNS, en: Foreign DNS }
    group: foreign
    selectable: true
    options: [cloudflare, google, alidns, tencent]
    default: cloudflare

  - id: dns-secure
    name: { zh: 安全DNS, en: Secure DNS }
    group: secure
    selectable: true
    options: [cloudflare, google]
    default: cloudflare

  - id: dns-google
    name: { zh: 谷歌DNS, en: Google DNS }
    group: google
    selectable: true
    options: [google, cloudflare, alidns, tencent]
    default: google

  - id: dns-cloudflare
    name: { zh: Cloudflare DNS, en: Cloudflare DNS }
    group: cloudflare
    selectable: true
    options: [cloudflare, google, alidns, tencent]
    default: cloudflare

  - id: dns-selectable
    name: { zh: 可选DNS, en: Selectable DNS }
    group: foreign
    selectable: true
    options: [cloudflare, google, alidns, tencent]
    default: cloudflare
