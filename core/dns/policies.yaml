# ============================================================
# DNS Layer 3: Policies (what services bind to)
# ============================================================
# Service.dns MUST reference a policy id from this file.
# options = list of resolver ids (must exist in resolvers.yaml)
# group   = default group (must exist in groups.yaml)
# default = must be one of options

version: 1

policies:
  - id: dns-system
    name: { zh: 系统DNS, en: System DNS }
    group: system
    selectable: false
    options: [system]
    default: system

  - id: dns-china
    name: { zh: 中国DNS, en: China DNS }
    group: china
    selectable: true
    options: [alidns, tencent, system, google, cloudflare]
    default: alidns

  - id: dns-foreign
    name: { zh: 国外DNS, en: Foreign DNS }
    group: foreign
    selectable: true
    options: [cloudflare, google, alidns, tencent, system]
    default: cloudflare

  - id: dns-secure
    name: { zh: 安全DNS, en: Secure DNS }
    group: secure
    selectable: true
    options: [cloudflare, google]
    default: cloudflare

  - id: dns-google
    name: { zh: 谷歌DNS, en: Google DNS }
    group: google
    selectable: true
    options: [google, cloudflare, alidns, tencent, system]
    default: google

  - id: dns-cloudflare
    name: { zh: Cloudflare DNS, en: Cloudflare DNS }
    group: cloudflare
    selectable: true
    options: [cloudflare, google, alidns, tencent, system]
    default: cloudflare

  - id: dns-selectable
    name: { zh: 可选DNS, en: Selectable DNS }
    group: foreign
    selectable: true
    options: [cloudflare, google, alidns, tencent, system]
    default: cloudflare
